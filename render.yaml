services:
  - type: web
    name: health-nest-web
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://health-nest-web.onrender.com # Replace with your actual Render URL once deployed
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: health-nest-db
          property: connectionString

databases:
  - name: health-nest-db
    plan: free
    databaseName: health_nest
    user: health_nest_user
